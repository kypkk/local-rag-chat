<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local RAG Chat</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --fg: #1c1b18;
        --muted: #6d685e;
        --user: #e7f0f7;
        --assistant: #f2efe9;
        --accent: #b3541e;
        --border: #e3ded3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171613;
          --panel: #201f1a;
          --fg: #e8e4da;
          --muted: #9a958a;
          --user: #22333f;
          --assistant: #26241d;
          --accent: #e08c4f;
          --border: #35322a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 -apple-system,
          "Segoe UI",
          "Noto Sans TC",
          system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        width: 100%;
        max-width: 780px;
        padding: 1rem 1.2rem 0.6rem;
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
      }
      header h1 {
        font-size: 1.15rem;
        margin: 0;
      }
      header .tag {
        color: var(--muted);
        font-size: 0.78rem;
      }
      header .clear {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--accent);
        background: none;
        border: none;
        cursor: pointer;
      }
      #chat {
        width: 100%;
        max-width: 780px;
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 1.2rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .msg {
        max-width: 85%;
        padding: 0.6rem 0.9rem;
        border-radius: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--assistant);
        border-bottom-left-radius: 4px;
      }
      .msg .role {
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.2rem;
      }
      .msg.error {
        background: color-mix(in srgb, var(--accent) 15%, var(--panel));
        color: var(--accent);
      }
      .sources {
        margin-top: 0.5rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--muted);
        font-size: 0.72rem;
        color: var(--muted);
      }
      .sources .sources-title {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.25rem;
      }
      .sources .source {
        margin: 0.1rem 0;
      }
      .sources .cite {
        font-weight: 600;
        margin-right: 0.35rem;
      }
      .cursor::after {
        content: "▌";
        color: var(--accent);
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      form {
        width: 100%;
        max-width: 780px;
        padding: 0.8rem 1.2rem 1.2rem;
        display: flex;
        gap: 0.6rem;
        align-items: flex-end;
        background: var(--bg);
        border-top: 1px solid var(--border);
      }
      textarea {
        flex: 1;
        resize: none;
        max-height: 140px;
        padding: 0.6rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
      }
      button.send {
        padding: 0.6rem 1.1rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.send:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ben</h1>
      <span class="tag">Local Streaming RAG Chat Application </span>
      <button class="clear" id="clear">clear</button>
    </header>

    <div id="chat"></div>

    <form id="form">
      <textarea
        id="input"
        rows="1"
        placeholder="Chat with the RAG !!"
      ></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>

    <script>
      // ── client-side conversation state (server is stateless; we send this each turn) ──
      const history = []; // [{role:'user',content}, {role:'assistant',content}, ...] -- raw Q/A only

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");

      function addBubble(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        const who = document.createElement("div");
        who.className = "role";
        who.textContent = role;
        const body = document.createElement("div");
        body.textContent = text;
        el.append(who, body);
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return body; // return the text node holder so we can stream into it
      }

      // ── consume the POST SSE stream: fetch + ReadableStream (EventSource can't POST) ──
      async function streamAnswer(question) {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const bubble = addBubble("assistant", "");
        bubble.parentElement.classList.add("cursor"); // blinking cursor while streaming

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "",
          answer = "";
        const sourcesMap = {}; // n -> human-readable breadcrumb (arrives as a "sources" event)

        function finish() {
          bubble.parentElement.classList.remove("cursor");
          renderSources(bubble, answer, sourcesMap); // resolve the [n] the answer cited
          return answer;
        }

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n"); // SSE events are separated by a blank line
          buffer = events.pop(); // keep the last (possibly incomplete) piece

          for (const event of events) {
            const line = event.trim();
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") return finish();

            const msg = JSON.parse(payload); // JSON.parse -> newline-safe (server json.dumps'd it)
            if (msg.type === "sources") {
              for (const item of msg.items) sourcesMap[item.n] = item.label;
            } else if (msg.type === "token") {
              answer += msg.text;
              bubble.textContent = answer; // only tokens go into the bubble -> history stays clean
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
        return finish();
      }

      // Resolve the bracket citations the model actually wrote ([1], [2], ...) into a
      // footnote list of full source breadcrumbs, below the answer bubble.
      function renderSources(bubble, answer, sourcesMap) {
        const cited = [...answer.matchAll(/\[(\d+)\]/g)].map((m) => Number(m[1]));
        const unique = [...new Set(cited)].filter((n) => sourcesMap[n]);
        if (!unique.length) return;

        const box = document.createElement("div");
        box.className = "sources";
        const rows = unique
          .map(
            (n) =>
              `<div class="source"><span class="cite">[${n}]</span>${escapeHtml(sourcesMap[n])}</div>`,
          )
          .join("");
        box.innerHTML = `<div class="sources-title">Sources</div>${rows}`;
        bubble.parentElement.appendChild(box);
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      async function onSubmit(question) {
        addBubble("user", question);
        sendBtn.disabled = true;
        input.disabled = true;
        try {
          const answer = await streamAnswer(question);
          // remember this turn for the next request (raw Q/A)
          history.push({ role: "user", content: question });
          history.push({ role: "assistant", content: answer });
        } catch (err) {
          addBubble(
            "error",
            "Error: " + err.message + "  (is the server / Ollama running?)",
          );
        } finally {
          sendBtn.disabled = false;
          input.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        input.value = "";
        input.style.height = "auto";
        onSubmit(q);
      });

      // Enter to send, Shift+Enter for newline; auto-grow the textarea
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 140) + "px";
      });

      document.getElementById("clear").addEventListener("click", () => {
        history.length = 0;
        chat.innerHTML = "";
        input.focus();
      });

      input.focus();
    </script>
  </body>
</html>
